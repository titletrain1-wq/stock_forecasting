[project]
name = "stock-forecasting"
version = "1.0.0"
description = "Personal single-user stock/crypto forecast app with immutable ledger"

requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.14",
    "sqlalchemy-libsql",
    "streamlit>=1.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "APScheduler>=3.10",
    "httpx>=0.25",
    "tenacity>=8.2",
    "pydantic-settings>=2.0",
    "pandas-ta>=0.3.14b0",
    "joblib>=1.3",
    "pandas-market-calendars>=4.1",
    "yfinance>=1.7.0",
    "plotly>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
exclude = ["docs/**"]

[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"
